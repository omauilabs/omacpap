name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: fork pull requests can run the tests but cannot write to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    # Self-hosted only: GitHub-hosted runners are forbidden by owner rule (minutes cost money).
    # This repo is public, so fork PRs are skipped: untrusted fork code must never run on our
    # runners. Fork PRs can be tested by a maintainer pushing the branch to this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, omauilabs]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # README promises Python 3.11+; test the floor through the newest release.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Standard library only: nothing to install. The tests run against a local mock of myAir.
      - run: python -W always::ResourceWarning -m unittest discover -s tests -v
